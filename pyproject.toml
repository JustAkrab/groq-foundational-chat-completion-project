[project]
name = "basic-groq-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reda", email = "reda.akrab13@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "asyncio>=4.0.0",
    "groq>=1.7.0",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "tavily>=1.1.0",
]

[project.scripts]
basic-groq-chatbot = "basic_groq_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
